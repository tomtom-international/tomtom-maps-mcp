name: Build MCPB Bundles

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - 'main'
  merge_group:
    types: [ checks_requested ]
  release:
    types: [published]

jobs:
  pre-check:
    runs-on: ubuntu-22.04
    if: github.event_name == 'push'
    outputs:
      skip-workflow: ${{ steps.check.outputs.skip-workflow }}
    steps:
      - name: Check if workflow should be skipped
        id: check
        env:
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [[ "$COMMIT_AUTHOR" == "github-actions[bot]" ]] && [[ "$COMMIT_MESSAGE" == Release\ version* ]]; then
            echo "skip-workflow=true" >> $GITHUB_OUTPUT
            echo "Skipping this workflow..."
          else
            echo "skip-workflow=false" >> $GITHUB_OUTPUT
            echo "Proceeding with this workflow..."
          fi

  build-mcpb:
    name: Build MCPB (${{ matrix.platform }}-${{ matrix.arch }})
    needs: [pre-check]
    if: |
      always() &&
      (github.event_name == 'release' || github.event_name == 'pull_request' || needs.pre-check.outputs.skip-workflow == 'false')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: darwin
            arch: arm64
          - os: ubuntu-22.04
            platform: linux
            arch: x64
          - os: windows-2022
            platform: win32
            arch: x64
    runs-on: ${{ matrix.os }}
    env:
      NODE_OPTIONS: ${{ matrix.platform == 'darwin' && '--max-old-space-size=8192' || '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update version from release tag
        if: github.event_name == 'release'
        shell: bash
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$TAG_NAME" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Unexpected release tag: $TAG_NAME" >&2
            exit 1
          fi
          version_number="${TAG_NAME#v}"
          echo "Updating version to ${version_number}"
          sed -i.bak "s/\"version\": \".*\"/\"version\": \"${version_number}\"/" manifest-binary.json
          rm -f manifest-binary.json.bak

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm run build

      - name: Build MCPB bundle
        run: pnpm run build:mcpb

      - name: Upload MCPB artifact
        uses: actions/upload-artifact@v4
        with:
          name: tomtom-maps-mcp-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/mcpb/tomtom-maps-mcp-${{ matrix.platform }}-${{ matrix.arch }}.mcpb
          retention-days: 90

      - name: Upload to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.release.tag_name }}
          BUNDLE_PATH: dist/mcpb/tomtom-maps-mcp-${{ matrix.platform }}-${{ matrix.arch }}.mcpb
        shell: bash
        run: gh release upload "$TAG_NAME" "$BUNDLE_PATH" --clobber
