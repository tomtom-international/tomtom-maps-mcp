name: Build

on:
  push:
    branches:
      - '**'  # Build on all branches
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  pre-check:
    runs-on: ubuntu-22.04
    outputs:
      skip-workflow: ${{ steps.check.outputs.skip-workflow }}
    steps:
      - name: Check if workflow should be skipped
        id: check
        env:
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [[ "$COMMIT_AUTHOR" == "github-actions[bot]" ]] && [[ "$COMMIT_MESSAGE" == Release\ version* ]]; then
            echo "skip-workflow=true" >> $GITHUB_OUTPUT
            echo "Skipping this workflow..."
          else
            echo "skip-workflow=false" >> $GITHUB_OUTPUT
            echo "Proceeding with this workflow..."
          fi

  build-and-push-image:
    needs: [pre-check]
    if: ${{ needs.pre-check.outputs.skip-workflow == 'false' }}
    # Pinned to v1.14.0 (not the mutable v1 tag): v1.15.0 introduced
    # aws-actions/configure-aws-credentials and google-github-actions/auth, which the
    # enterprise Actions allowlist rejects, so every run failed at workflow startup on
    # every branch. Revert to a newer release once those two actions are allowlisted.
    uses: docker/github-builder/.github/workflows/build.yml@v1.14.0
    permissions:
      contents: read
      packages: write
    with:
      output: image
      # Only push the image to the repo if it was generated from the upstream repo (not from a fork).
      push: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
      platforms: linux/amd64,linux/arm64
      meta-images: ghcr.io/${{ github.repository }}
      meta-tags: |
        type=ref,event=branch
        type=ref,event=pr
        type=sha,prefix=sha-
      build-args: |
        VERSION=${{ github.sha }}
      sign: false
      cache: true
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
