name: OAuth end-to-end

on:
  schedule:
    - cron: "17 */6 * * *"
  repository_dispatch:
    types: [dev-deployed]
  workflow_dispatch:
    inputs:
      target:
        description: Deployment to test
        type: choice
        options: [prod, dev]
        default: prod

permissions:
  contents: read
  actions: read

env:
  OAUTH_E2E_TARGET: ${{ github.event_name == 'repository_dispatch' && 'dev' || inputs.target || 'prod' }}

concurrency:
  group: oauth-e2e-${{ github.event_name == 'repository_dispatch' && 'dev' || inputs.target || 'prod' }}
  cancel-in-progress: false

jobs:
  test:
    name: Log in and call a tool as each account
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Wait until dev serves the announced image
        if: github.event_name == 'repository_dispatch'
        env:
          TAG: ${{ github.event.client_payload.tag }}
        run: |
          # /health exposes only the semver, so a sha-tagged image cannot be polled for; a rollout takes about four minutes.
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag '$TAG' is not a release tag; giving the rollout six minutes"
            sleep 360
            exit 0
          fi
          expected="${TAG#v}"
          for attempt in $(seq 1 40); do
            version=$(curl -fsS -m 10 https://mcp-dev.api-system.tomtom.com/maps/health | jq -r .version || true)
            if [[ "$version" == "$expected" ]]; then
              echo "dev serves $version"
              exit 0
            fi
            echo "attempt $attempt: dev serves '$version', waiting for $expected"
            sleep 15
          done
          echo "::error::dev never served $expected"
          exit 1

      - name: Run the OAuth end-to-end test
        run: pnpm test:e2e:oauth
        env:
          CI: 'true'
          E2E_B2B_EMAIL: ${{ secrets.E2E_B2B_EMAIL }}
          E2E_B2B_PASSWORD: ${{ secrets.E2E_B2B_PASSWORD }}
          E2E_B2C_PROD_EMAIL: ${{ secrets.E2E_B2C_PROD_EMAIL }}
          E2E_B2C_PROD_PASSWORD: ${{ secrets.E2E_B2C_PROD_PASSWORD }}
          E2E_B2C_DEV_EMAIL: ${{ secrets.E2E_B2C_DEV_EMAIL }}
          E2E_B2C_DEV_PASSWORD: ${{ secrets.E2E_B2C_DEV_PASSWORD }}

      - name: Upload the Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oauth-e2e-report-${{ env.OAUTH_E2E_TARGET }}-${{ github.run_id }}
          path: playwright-report/
          retention-days: 30

  alert:
    name: Alert when the outcome changes
    needs: test
    if: always() && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-22.04
    steps:
      - name: Find the outcome of the previous run on this trigger
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/oauth-e2e.yml/runs?event=${{ github.event_name }}&status=completed&per_page=5" \
            --jq '[.workflow_runs[] | select(.id != ${{ github.run_id }})][0].conclusion // "none"')
          echo "conclusion=$previous" >> "$GITHUB_OUTPUT"

      - name: Post to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_ALERTS_WEBHOOK_URL }}
          CURRENT: ${{ needs.test.result }}
          PREVIOUS: ${{ steps.previous.outputs.conclusion }}
          TARGET: ${{ env.OAUTH_E2E_TARGET }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          case "$CURRENT/$PREVIOUS" in
            failure/failure) echo "Still failing, already alerted"; exit 0 ;;
            failure/*) text=":red_circle: Maps MCP OAuth end-to-end failed on $TARGET: $RUN_URL" ;;
            success/failure) text=":large_green_circle: Maps MCP OAuth end-to-end recovered on $TARGET: $RUN_URL" ;;
            *) echo "No change of outcome ($CURRENT after $PREVIOUS)"; exit 0 ;;
          esac
          if [[ -z "$SLACK_WEBHOOK_URL" ]]; then
            echo "::warning::SLACK_ALERTS_WEBHOOK_URL is not set; would have posted: $text"
            exit 0
          fi
          curl -fsS -X POST -H 'Content-Type: application/json' \
            --data "$(jq -cn --arg text "$text" '{text: $text}')" "$SLACK_WEBHOOK_URL"
